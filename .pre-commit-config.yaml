repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(packages/[^/]+/(src|tests)/|scripts/)
      - id: ruff-format
        files: ^(packages/[^/]+/(src|tests)/|scripts/)

  - repo: local
    hooks:
      - id: unasync-check
        name: generated sync twins are fresh
        entry: uv run python scripts/unasync.py --check
        language: system
        pass_filenames: false
        files: ^(packages/[^/]+/(src|tests)/.*\.py|scripts/unasync\.py)$
