[project]
name = "aireloom"
version = "0.8.0"
description = "Python interface for the OpenAIRE Graph API, built on top of the bibliofabric framework."
authors = [
    {name = "Samuel Mok",email = "s.mok@utwente.nl"}
]
readme = "README.md"
license = {text= "MIT"}
requires-python = ">=3.12"
dependencies = [
    "bibliofabric>=0.6,<0.7",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
"Homepage" = "https://github.com/utsmok/bibliofabric/tree/main/packages/aireloom"

[build-system]
requires = ["uv_build>=0.9.22,<0.12"]
build-backend = "uv_build"

[tool.unasync]
# The core framework classes are defined outside this package, so the
# generator's class-rename derivation never sees them; map them explicitly.
replacements = { "BaseApiClient" = "SyncBaseApiClient", "ResourceClient" = "SyncResourceClient" }
