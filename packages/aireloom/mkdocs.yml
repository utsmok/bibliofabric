site_name: AIREloom Docs
site_url: https://utsmok.github.io/aireloom/
repo_url: https://github.com/utsmok/aireloom/
site_author: S. Mok

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - Usage:
      - Research products: usage/research_products.md
      - Projects, organizations, data sources, persons: usage/projects.md
      - Links: usage/links.md
      - Scholix: usage/scholix.md
  - Errors, retries, and rate limits: errors.md
  - Upstream quirks: quirks.md
  - API reference: api.md
  - Contributing: contributing.md
  - Changelog: https://github.com/utsmok/aireloom/blob/main/CHANGELOG.md
watch:
  - src/aireloom
