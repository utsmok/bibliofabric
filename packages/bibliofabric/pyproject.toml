[project]
name = "bibliofabric"
version = "0.6.0"
description = "Shared core for scholarly API clients: HTTP, auth, retries, paging, and typed resource clients"
readme = "README.md"
authors = [
    {name = "Samuel Mok", email = "s.mok@utwente.nl"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.9.1",
    "tenacity>=9.0.0",
]

[project.urls]
"Homepage" = "https://github.com/utsmok/bibliofabric"

[build-system]
requires = ["uv_build>=0.9.22,<0.12"]
build-backend = "uv_build"
