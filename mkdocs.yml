site_name: bibliofabric family docs
site_url: https://utsmok.github.io/bibliofabric/
repo_url: https://github.com/utsmok/bibliofabric/
site_author: S. Mok

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/bibliofabric/src
            - packages/aireloom/src
            - packages/aletheca/src
            - packages/stavrophora/src
            - packages/rorifer/src
            - packages/zenotheca/src
            - packages/dataphora/src
            - packages/opcitato/src
            - packages/hodoi/src
            - packages/scholiast/src
            - packages/orchis/src
            - packages/europaea/src
            - packages/quiddita/src
            - packages/diurnalia/src
            - packages/seriatim/src
            - packages/archeion/src
          options:
            show_root_heading: true

watch:
  - packages/bibliofabric/src/bibliofabric
  - packages/aireloom/src/aireloom
  - packages/aletheca/src/aletheca
  - packages/stavrophora/src/stavrophora
  - packages/rorifer/src/rorifer
  - packages/zenotheca/src/zenotheca
  - packages/dataphora/src/dataphora
  - packages/opcitato/src/opcitato
  - packages/hodoi/src/hodoi
  - packages/scholiast/src/scholiast
  - packages/orchis/src/orchis
  - packages/europaea/src/europaea
  - packages/quiddita/src/quiddita
  - packages/diurnalia/src/diurnalia
  - packages/seriatim/src/seriatim
  - packages/archeion/src/archeion

nav:
  - Overview: index.md
  - Contributing: contributing.md
  - bibliofabric:
