[project]
name = "bibliofabric"
version = "0.6.0"
description = "Shared core for scholarly API clients: HTTP, auth, retries, paging, and typed resource clients"
readme = "README.md"
authors = [
    {name = "Samuel Mok", email = "s.mok@utwente.nl"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.9.1",
    "tenacity>=9.0.0",
]

[project.urls]
"Homepage" = "https://github.com/utsmok/bibliofabric"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.26.0",
    "pytest-httpx>=0.35.0",
    "ruff==0.17.6",
    "ty==0.0.107",
]
docs = [
    "mkdocs~=1.6.0",
    "mkdocs-material~=9.5.0",
    "mkdocstrings[python]",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.uv.pip]
generate-hashes = true

[tool.ruff]
line-length = 88
extend-exclude = ["tests/_legacy", "examples"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",     # isort
    "B",     # bugbear -- flake8 bugfinder
    "Q",     # correct quotes usage
    "PTH",   # Replace os functions with pathlib functions
    "SIM",   # Simplify statements
    "RET",   # Return value related rules
    "PIE",   # misc flake8 rules
    "FBT",   # boolean traps
    "PERF",  # performance optimization
    "PL",    # pylint
    "UP",    # check for deprecated ways of coding
    "FURB",
]

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 25
max-statements = 75


[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["PLR2004"]  # literal HTTP statuses and counts are the point of the assertions

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = ["tests"]
addopts = "--ignore=tests/_legacy"
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
