# Virtual workspace root: the packages live in packages/*, this project is not built or published.

[tool.uv]
package = false
default-groups = ["dev", "docs"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bibliofabric = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.26.0",
    "pytest-httpx>=0.35.0",
    "ruff==0.17.6",
    "ty==0.0.107",
    "unasync>=0.6.0",
]
docs = [
    "mkdocs~=1.6.0",
    "mkdocs-material~=9.5.0",
    "mkdocstrings[python]~=0.29.0",
]

# Ruff config shared by the whole workspace (was identical in each family repo).
[tool.ruff]
line-length = 88
extend-exclude = ["archive"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",     # isort
    "B",     # bugbear -- flake8 bugfinder
    "Q",     # correct quotes usage
    "PTH",   # Replace os functions with pathlib functions
    "SIM",   # Simplify statements
    "RET",   # Return value related rules
    "PIE",   # misc flake8 rules
    "FBT",   # boolean traps
    "PERF",  # performance optimization
    "PL",    # pylint
    "UP",    # check for deprecated ways of coding
    "FURB",
]

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 25
max-statements = 75
max-returns = 10

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"packages/*/tests/**" = ["PLR2004"]  # literal HTTP statuses and counts are the point of the assertions

[tool.pytest.ini_options]
consider_namespace_packages = true
pythonpath = ["."]
testpaths = [
    "packages/bibliofabric/tests",
    "packages/aireloom/tests",
    "packages/aletheca/tests",
    "packages/stavrophora/tests",
    "packages/rorifer/tests",
    "packages/zenotheca/tests",
    "packages/dataphora/tests",
    "packages/opcitato/tests",
    "packages/hodoi/tests",
    "packages/scholiast/tests",
    "packages/orchis/tests",
    "packages/europaea/tests",
    "packages/quiddita/tests",
    "packages/diurnalia/tests",
    "packages/seriatim/tests",
    "packages/archeion/tests",
    "packages/prodromus/tests",
]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live_api: marks tests that hit the live API (requires credentials, skipped by default)",
]
addopts = "-m 'not live_api'"
